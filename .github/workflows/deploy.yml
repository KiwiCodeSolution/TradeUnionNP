name: Deploy Frontend to Server

# Конфігурація тригера
on:
  push:
    branches:
      - dev  # Пайплайн запускається тільки при push у гілку dev

jobs:
  # ----------------- ЕТАП 1: ТЕСТУВАННЯ -----------------
  test:
    name: 1. Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Use Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: echo "Run tests" # Переконайтесь, що у вас є скрипт "test"

  # ----------------- ЕТАП 2: ВАЛІДАЦІЙНА ЗБІРКА -----------------
  build:
    name: 2. Build Project
    runs-on: ubuntu-latest
    needs: test # Запускається після 'test'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Use Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build project
        run: npm run build # Валідаційна збірка

  # ----------------- ЕТАП 3: РОЗГОРТАННЯ -----------------
  deploy:
    name: 3. Deploy to Server
    runs-on: ubuntu-latest
    needs: build # Запускається після 'build'

    steps:
      # Крок 1: Налаштовуємо SSH-агент
      - name: Setup SSH Agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      # Крок 2: Створюємо конфіг для SSH
      - name: Create SSH config
        run: |
          mkdir -p ~/.ssh/
          chmod 700 ~/.ssh/
          echo -e "Host *\n\tStrictHostKeyChecking no\n\n" > ~/.ssh/config

      # Крок 3: Підключаємось до сервера і виконуємо скрипт деплою
      # Цей скрипт використовує логіку для фронтенду
      - name: Connect and deploy
        run: |
          ssh -p 52201 ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "
            cd ${{ secrets.DEPLOY_PATH }} &&

            echo 'Крок 1: Тимчасово переміщуємо файли .env (якщо є)' &&
            mkdir -p .tmp_deploy &&
            mv .env .tmp_deploy/ || true &&

            echo 'Крок 2: Оновлення коду з репозиторію' &&
            # Переконайтесь, що на сервері налаштований доступ до репозиторію по HTTPS з токеном
            eval \$(ssh-agent -s) &&
            ssh-add ~/.ssh/yevbober_rsa &&
            git fetch origin dev &&
            git checkout front &&
            git reset --hard origin/dev &&

            echo 'Крок 3: Повертаємо збережені файли' &&
            rm -rf ./.env &&
            mv .tmp_deploy/.env . || true &&
            rm -rf .tmp_deploy &&

            echo 'Крок 4: Встановлення залежностей, білд та перезапуск' &&
            npm install &&
            npm run build &&
            pm2 restart frontend &&
            sleep 5 &&
            pm2 describe frontend | grep -q 'status.*online'
          "

      # Крок 4: Надсилаємо сповіщення
      - name: Send Telegram notification
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            MESSAGE="✅ Deploy ФРОНТЕНДУ успішно завершено для *${{ github.event.repository.name }}* на гілці *${{ github.ref_name }}*%0AКоміт: [$(echo ${{ github.sha }} | cut -c1-8)](${{ github.event.repository.html_url }}/commit/${{ github.sha }})";
          else
            MESSAGE="❌ Помилка деплою ФРОНТЕНДУ для *${{ github.event.repository.name }}* на гілці *${{ github.ref_name }}*%0AКоміт: [$(echo ${{ github.sha }} | cut -c1-8)](${{ github.event.repository.html_url }}/commit/${{ github.sha }})";
          fi;
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
               -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
               -d "parse_mode=Markdown" \
               -d "text=${MESSAGE}"
